<!doctype html>
<!--
  Source for /public/og-image.png (1200×630).

  Regenerate with:
    npm run og

  Kept in the repo so the social card can be re-rendered when the phone
  number, headline, or brand colours change — rather than being an
  undocumented binary nobody can edit.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0a2540;
        --ink-soft: #4a6280;
        --paper: #f7f4ec;
        --paper-2: #fbfaf5;
        --rule: #e2dcc9;
        --rule-strong: #c9c0a6;
        --gold: #b8893c;
        --seal: #1f4d3a;
        --seal-soft: #dce7df;
        --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
        --sans: 'Inter Tight', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        font-family: var(--sans);
        background: var(--paper);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }

      /* Faint blueprint grid, echoing the site hero */
      .card::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: linear-gradient(var(--rule) 1px, transparent 1px),
          linear-gradient(90deg, var(--rule) 1px, transparent 1px);
        background-size: 52px 52px;
        opacity: 0.4;
      }

      .card::after {
        content: '';
        position: absolute;
        right: -180px;
        top: -180px;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(184, 137, 60, 0.14), transparent 68%);
      }

      .inner {
        position: relative;
        z-index: 1;
        display: contents;
      }

      /* ---- top ---- */
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        position: relative;
        z-index: 1;
      }

      .seal {
        width: 56px;
        height: 56px;
        flex: none;
        display: grid;
        place-items: center;
        border: 1px solid var(--rule-strong);
        border-radius: 50%;
        background: var(--paper-2);
      }

      .seal svg {
        width: 28px;
        height: 28px;
        display: block;
      }

      .brandText {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .brandName {
        display: block;
        font-family: var(--serif);
        font-size: 27px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.01em;
      }

      .brandSub {
        display: block;
        font-size: 13px;
        line-height: 1;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      /* ---- middle ---- */
      .headline {
        position: relative;
        z-index: 1;
        font-family: var(--serif);
        font-size: 76px;
        font-weight: 600;
        line-height: 1.04;
        letter-spacing: -0.028em;
        max-width: 17ch;
      }

      .headline em {
        font-style: italic;
        color: var(--gold);
      }

      /* ---- stats ---- */
      .stats {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: stretch;
        gap: 0;
        border-top: 1px solid var(--rule-strong);
        padding-top: 26px;
      }

      .stat {
        padding-right: 52px;
        margin-right: 52px;
        border-right: 1px solid var(--rule-strong);
      }

      .stat:last-of-type {
        border-right: none;
        margin-right: 0;
        padding-right: 0;
      }

      .statNum {
        font-family: var(--serif);
        font-size: 46px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }

      .statNum span {
        color: var(--gold);
      }

      .statLabel {
        font-size: 15px;
        color: var(--ink-soft);
        margin-top: 9px;
        letter-spacing: 0.02em;
      }

      .contact {
        margin-left: auto;
        align-self: flex-end;
        text-align: right;
      }

      .domain {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .phone {
        font-size: 15px;
        color: var(--ink-soft);
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <span class="seal">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#0A2540"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <path d="m9 12 2 2 4-4" stroke="#1F4D3A" />
          </svg>
        </span>
        <span class="brandText">
          <span class="brandName">Florida Energy Assistance</span>
          <span class="brandSub">Home energy upgrade programs</span>
        </span>
      </div>

      <h1 class="headline">
        Florida home energy upgrades <em>with $0 down.</em>
      </h1>

      <div class="stats">
        <div class="stat">
          <div class="statNum"><span>$</span>0</div>
          <div class="statLabel">Down payment</div>
        </div>
        <div class="stat">
          <div class="statNum">100<span>%</span></div>
          <div class="statLabel">Financing</div>
        </div>
        <div class="stat">
          <div class="statNum"><span>$</span>8,000</div>
          <div class="statLabel">Grants up to</div>
        </div>

        <div class="contact">
          <div class="domain">floridaenergyassistance.com</div>
          <div class="phone">855-549-3521</div>
        </div>
      </div>
    </div>
  </body>
</html>
